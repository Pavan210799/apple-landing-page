<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=apple" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iPhone - Apple</title>
    <style>
      html, body, #root { margin: 0; min-height: 100%; background: #f5f5f7; }
      .boot-shell {
        position: fixed; inset: 0; z-index: 10000; background: #f5f5f7;
        display: flex; flex-direction: column; gap: 12px; padding: 0 0 24px;
      }
      .boot-shell span {
        display: block; border-radius: 8px;
        background: linear-gradient(90deg, #e8e8ed, #f4f4f6, #e8e8ed);
        background-size: 200% 100%;
        animation: boot-shine 1.2s linear infinite;
      }
      .boot-nav { height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-bottom: 1px solid #d2d2d7; background: #fbfbfd; }
      .boot-nav span { width: 22px; height: 16px; }
      .boot-hero { background: #fff; padding: 48px 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .boot-hero .t { width: min(420px, 78vw); height: 28px; }
      .boot-hero .p { width: min(280px, 60vw); height: 14px; }
      .boot-hero .m { width: min(520px, 88vw); height: min(320px, 42vh); border-radius: 16px; margin-top: 12px; }
      @keyframes boot-shine { to { background-position: -200% 0; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" aria-hidden="true">
        <div class="boot-nav"><span></span><span></span><span></span></div>
        <div class="boot-hero"><span class="t"></span><span class="p"></span><span class="m"></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
